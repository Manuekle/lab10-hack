<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>INVENTRA</title>
<style>
body{margin:0;font:14px/1.4 "DejaVu Sans",sans-serif;background:#f4f1ea;color:#222;display:flex;height:100vh}
nav{width:200px;background:#2f3e2c;color:#e8e4d8;padding:16px 0}
nav h1{font-size:18px;margin:0 16px 4px}nav small{display:block;margin:0 16px 18px;opacity:.7}
nav a{display:block;padding:10px 16px;color:#e8e4d8;text-decoration:none;cursor:pointer}nav a.on{background:#556b4f}
main{flex:1;padding:22px 28px;overflow:auto}h2{margin:0 0 14px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
input,select{padding:6px 8px;border:1px solid #999;border-radius:3px;font:inherit}
button{padding:6px 14px;border:1px solid #556b4f;background:#fff;border-radius:3px;font:inherit;cursor:pointer}
button.pri{background:#556b4f;color:#fff}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left}th{background:#e3dfd2}
.pager{margin-top:10px;display:flex;gap:10px;align-items:center}
.modal{position:fixed;inset:0;background:#0006;display:none;align-items:center;justify-content:center}
.card{background:#fff;padding:20px 24px;border-radius:6px;width:440px}.card label{display:block;margin:10px 0 2px;font-size:12px;color:#555}.card input{width:95%}
.toast{position:fixed;right:24px;bottom:24px;background:#2f3e2c;color:#fff;padding:10px 16px;border-radius:4px;display:none}
</style></head><body>
<nav><h1>INVENTRA</h1><small>Gestión de compras</small>
<a class="on" id="nav-prov">Proveedores</a><a id="nav-ord">Órdenes de compra</a><a>Configuración</a></nav>
<main id="view"></main>
<div class="modal" id="modal"><div class="card"><h3 id="mtitle">Proveedor</h3>
<label>Razón social</label><input id="f-nombre"><label>RUT / NIT</label><input id="f-rut">
<label>Ciudad</label><input id="f-ciudad"><label>Teléfono de contacto</label><input id="f-contacto">
<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end"><button id="cancel">Cancelar</button><button class="pri" id="save">Guardar proveedor</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
let all=[],page=0,q='',editing=null;const PER=5;
const $=id=>document.getElementById(id);
async function load(){all=(await (await fetch('/state')).json()).proveedores;render()}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4000)}
function render(){
 const rows=all.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase()));const pages=Math.max(1,Math.ceil(rows.length/PER));page=Math.min(page,pages-1);
 $('view').innerHTML=`<h2>Proveedores</h2><div class="bar"><input id="q" placeholder="Buscar por razón social" value="${q}"><button id="go">Filtrar</button><span style="flex:1"></span><button class="pri" id="add">+ Agregar proveedor</button></div>
 <table><tr><th>ID</th><th>Razón social</th><th>RUT</th><th>Ciudad</th><th>Contacto</th><th></th></tr>${rows.slice(page*PER,page*PER+PER).map(p=>`<tr><td>${p.id}</td><td>${p.nombre}</td><td>${p.rut}</td><td>${p.ciudad}</td><td>${p.contacto}</td><td><button data-id="${p.id}" class="ed">Editar</button></td></tr>`).join('')}</table>
 <div class="pager"><button id="prev" ${page==0?'disabled':''}>« Anterior</button><span>Pág. ${page+1} de ${pages}</span><button id="next" ${page>=pages-1?'disabled':''}>Siguiente »</button></div>`;
 $('go').onclick=()=>{q=$('q').value;page=0;setTimeout(render,600)};$('prev').onclick=()=>{page--;setTimeout(render,600)};$('next').onclick=()=>{page++;setTimeout(render,600)};
 $('add').onclick=()=>open(null);document.querySelectorAll('.ed').forEach(b=>b.onclick=()=>open(all.find(p=>p.id==b.dataset.id)));
}
function open(p){editing=p;$('mtitle').textContent=p?`Editar ${p.id}`:'Nuevo proveedor';for(const k of['nombre','rut','ciudad','contacto'])$('f-'+k).value=p?p[k]:'';$('modal').style.display='flex'}
$('cancel').onclick=()=>$('modal').style.display='none';
$('save').onclick=async()=>{const d={};for(const k of['nombre','rut','ciudad','contacto'])d[k]=$('f-'+k).value;
 const r=await fetch(editing?`/proveedores/${editing.id}`:'/proveedores',{method:'POST',body:JSON.stringify(d)});const p=await r.json();
 $('modal').style.display='none';setTimeout(async()=>{await load();toast(editing?`Proveedor ${p.id} actualizado`:`Proveedor ${p.id} registrado`)},700)};
$('nav-ord').onclick=()=>{$('view').innerHTML='<h2>Órdenes de compra</h2><p>Sin órdenes.</p>'};$('nav-prov').onclick=render;
load();
</script></body></html>
